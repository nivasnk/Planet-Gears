<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | Planet Gears Precision Gears</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; padding: 40px 16px; }
    .nf h1 { font-size: clamp(100px, 22vw, 260px); line-height: .85; }
    .nf p { color: var(--steel-400); max-width: 460px; margin: 18px auto 30px; }
    .nf [data-gear] { position: absolute; width: 520px; right: -120px; bottom: -140px; opacity: .35; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="blueprint" aria-hidden="true"></div>
    <div data-gear="spur" data-teeth="30" data-tone="dark" aria-hidden="true"></div>
    <div>
      <span class="eyebrow">Error 404</span>
      <h1 class="metal-text">404</h1>
      <p>This page has slipped a tooth. It may have moved, or the link may be out of date.</p>
      <a class="btn btn-primary" href="./">Back to Home</a>
    </div>
  </main>
  <script src="assets/js/gears.js"></script>
  <script>GearArt.renderAll();</script>
</body>
</html>
